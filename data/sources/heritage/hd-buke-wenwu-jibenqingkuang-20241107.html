<p style=";text-autospace:ideograph-numeric;&#10;;;">　　<span style="'yes';;&#10;'Times New Roman';;">截至</span><span style="'yes';;&#10;'Times New Roman';;">2023年12月，</span><span style="'yes';;&#10;'Times New Roman';;">海淀区共有不可移动文物3</span><span style="'yes';;&#10;'Times New Roman';;">28</span><span style="'yes';;&#10;'Times New Roman';;">处，</span><span style="'yes';;&#10;'Times New Roman';;">其中全国重点文物保护单位</span><span style="'yes';;&#10;'Times New Roman';;">22</span><span style="'yes';;&#10;'Times New Roman';;">处、北京市级文物保护单位2</span><span style="'yes';;&#10;'Times New Roman';;">9</span><span style="'yes';;&#10;'Times New Roman';;">处，海淀区级文物保护单位</span><span style="'yes';;&#10;'Times New Roman';;">101</span><span style="'yes';;&#10;'Times New Roman';;">处，文物普查登记项目1</span><span style="'yes';;&#10;'Times New Roman';;">76</span><span style="'yes';;&#10;'Times New Roman';;">处；</span></p>
<p style=";text-autospace:ideograph-numeric;&#10;;;">　　<span style="'yes';;&#10;'Times New Roman';;">地下埋藏区</span><span style="'yes';;&#10;'Times New Roman';;">5</span><span style="'yes';;&#10;'Times New Roman';;">处:金山地下埋藏区、礼王坟地下埋藏区、恩济庄地下埋藏区、双塔地下埋藏区</span><span style="'yes';;&#10;'Times New Roman';;">、金中都地下埋藏区</span><span style="'yes';;&#10;'Times New Roman';;">；</span></p>
<p>　　世界文化遗产2处:颐和园、大运河遗址（海淀段）。&nbsp;</p>
