<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>百年京张AI创新带 — 数据看板</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:1200px;margin:0 auto;padding:2rem;background:#f8f9fa}
h1{color:#1a1a2e;border-bottom:3px solid #e94560;padding-bottom:.5rem}
.card{background:white;padding:1rem;margin:.5rem 0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card .label{font-size:.85rem;color:#666}
.card .value{font-size:1.5rem;font-weight:bold;color:#1a1a2e}
.figures{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:1rem;margin-top:1rem}
img{width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.note{color:#888;font-size:.8rem;margin-top:2rem}
</style>
</head>
<body>
<h1>百年京张AI创新带 · 城市设计数据看板</h1>
<div class="card"><div class="label">场地面积 (EPSG:4548)</div><div class="value" data-metric="site_area_sqm">11,412,825 m²</div></div>
<div class="card"><div class="label">绿地率</div><div class="value" data-metric="green_ratio">0.1234 (12.3%)</div></div>
<div class="card"><div class="label">公共空间率</div><div class="value" data-metric="public_space_ratio">0.0733 (7.3%)</div></div>
<h2>分析图纸</h2>
<div class="figures">
<img src="../assets/figures/site-overview.png" alt="总体概念图">
<img src="../assets/figures/land-use-structure.png" alt="用地布局图">
<img src="../assets/figures/key-areas.png" alt="重点区域图">
<img src="../assets/figures/mobility-bluegreen.png" alt="交通与蓝绿系统">
<img src="../assets/figures/metrics-evidence.png" alt="指标证据图">
</div>
<p class="note">数据来源: geometry/*.geojson 在 EPSG:4548 投影下计算 | AI 生成设计提案 | provisional boundary | 指标值与 metrics.json 一致</p>
</body>
</html>
